<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Linkroid Logo">
  <defs>
    <radialGradient id="tileGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#0B132B"/>
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#tileGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Linkroid Connection Emblem -->
  <!-- Phone Loop (Android Green) -->
  <rect x="128" y="142" width="124" height="228" rx="48" ry="48"
        fill="none" stroke="#00E676" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PC Desktop Loop (Electric Blue) -->
  <rect x="199" y="189" width="210" height="134" rx="38" ry="38"
        fill="none" stroke="#0091FF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Connection Nexus -->
  <circle cx="228" cy="256" r="28" fill="#38BDF8"/>
  <circle cx="222" cy="250" r="11" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
